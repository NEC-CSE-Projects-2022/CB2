{% extends "base.html" %}
{% block content %}
<form id="uploadForm" action="{{ url_for('predict') }}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
  <div class="mb-3">
    <label for="csvFile" class="form-label">Choose CSV file</label>
    <input class="form-control" type="file" id="csvFile" name="file" accept=".csv" required>
    <div class="invalid-feedback">Please upload a CSV file.</div>
  </div>

  <button id="submitBtn" type="submit" class="btn btn-primary">Predict</button>

  <div id="spinner" class="mt-3" style="display:none;">
    <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
    <span class="ms-2">Processing... please wait</span>
  </div>

  {% if error %}
  <div class="alert alert-danger mt-3">{{ error }}</div>
  {% endif %}
</form>

<script>
const form = document.getElementById('uploadForm');
form.addEventListener('submit', () => {
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('spinner').style.display = 'inline-block';
});
</script>
{% endblock %}
