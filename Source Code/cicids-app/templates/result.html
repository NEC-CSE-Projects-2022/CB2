{% extends "base.html" %}
{% block content %}
  <h2>Prediction Results</h2>
  {% if results %}
    <table class="table table-bordered mt-3">
      <thead>
        <tr><th>#</th><th>Prediction</th></tr>
      </thead>
      <tbody>
        {% for r in results %}
          <tr><td>{{ loop.index }}</td><td>{{ r }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <div class="alert alert-warning">No results returned.</div>
  {% endif %}
  <a href="{{ url_for('upload') }}" class="btn btn-primary mt-3">Upload another file</a>
{% endblock %}
