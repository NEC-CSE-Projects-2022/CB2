<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CICIDS Detector</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="page-wrapper">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">CICIDS Detector</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {% if active=='home' %}active{% endif %}" href="{{ url_for('home') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='about' %}active{% endif %}" href="{{ url_for('about') }}">About</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='methodology' %}active{% endif %}" href="{{ url_for('methodology') }}">Methodology</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='upload' %}active{% endif %}" href="{{ url_for('upload') }}">Upload File</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='contact' %}active{% endif %}" href="{{ url_for('contact') }}">Objectives</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="content py-4">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>
<footer class="site-footer">
    <div class="container">
        © Dept of CSE, Narasaraopeta Engineering College,
        Narasaraopet, Andhra Pradesh, India - 522601
    </div>
</footer>


</body>
</html>
